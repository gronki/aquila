name: aquila
title: aquila
base: core24
version: git
license: BSD-3-Clause
summary: Command-line toolkit for astrophotography stacking and compositing
website: https://github.com/gronki/aquila
description: |
  Aquila is a fast, terminal-native toolkit for reducing and compositing
  astronomical image data on Linux. The image processing heart is written
  in **Modern Fortran** with OpenMP parallelism. It fits naturally into shell 
  scripts and automated pipelines.

  The package includes **three programs**:

  * `aqstack`: calibrates and stacks monochromatic CCD frames. Handles bias,
    dark, and flat subtraction, hot pixel correction, frame alignment, and
    combining by average, median, or sigma-clipped mean.

  * `aqlrgb`: composites multi-filter data into colour images. Supports the
    classic LRGB workflow as well as narrowband palette mixing, white-balance
    equalisation, background suppression, and nonlinear stretching (asinh,
    sqrt, log) before writing FITS or PNG output.

  * `aqcli`: a scripting interpreter for writing end-to-end image processing
    pipelines. Scripts load frames, run calibration and stacking routines,
    apply convolution kernels and math operations, and save results — all in
    a compact, readable domain-specific language.

  Report an issue/feature request: https://github.com/gronki/aquila/issues

source-code: https://github.com/gronki/aquila
issues: https://github.com/gronki/aquila/issues

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

plugs:
  home:
    interface: home

parts:
  build-aquila:
    plugin: cmake
    source: .
    cmake-parameters:
      - "-DCMAKE_INSTALL_PREFIX=/usr"
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DAQUILA_PARALLEL=On"
      - "-DAQUILA_TESTS=Off"
      - "-DAQUILA_WINDOW=On"
    build-packages:
      - libreadline-dev
      - pkg-config
      - zlib1g-dev
      - cmake
      - g++
      - gfortran
      - gcc
      - libx11-dev
      - libxext-dev
      - libwayland-dev
      - wayland-protocols
      - libxkbcommon-dev
      - libdecor-0-dev
    stage-packages:
      - libreadline8
      - libgfortran5
      - zlib1g
      - libgomp1
      - libx11-6
      - libxext6
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libdecor-0-0

apps:
  stack:
    command: usr/bin/aqstack
    aliases: [ "aqstack" ]
  lrgb:
    command: usr/bin/aqlrgb
    aliases: [ "aqlrgb" ]
  cli:
    command: usr/bin/aqcli
    aliases: [ "aqcli" ]
    plugs: [ "x11", "wayland" ]
    environment:
      AQUILA_HISTORY_FILE: $SNAP_USER_DATA/aquila_history.txt
      SDL_VIDEODRIVER: wayland,x11

