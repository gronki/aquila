name: Build and release AppImage

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  VERBOSE: 1

jobs:

  build-appimage:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          sudo bash scripts/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: "aquila-${{ matrix.arch }}"
          path: aquila-${{ matrix.arch }}.AppImage

  release-appimage:
    name: Release AppImage
    runs-on: ubuntu-latest
    needs: build-appimage
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "aquila-*"
          merge-multiple: true

      - name: Create versioned release
        run: |
          gh release delete ${{ github.ref_name }} --yes --cleanup-tag 2>/dev/null || true
          gh release create ${{ github.ref_name }} aquila-*.AppImage \
            --title "Aquila ${{ github.ref_name }}" \
            --notes "Download the AppImage for your architecture — runs on any modern Linux without installation."

      - name: Update stable release
        run: |
          gh release delete stable --yes --cleanup-tag 2>/dev/null || true
          gh release create stable aquila-*.AppImage \
            --title "Aquila stable (${{ github.ref_name }})" \
            --notes "Latest stable release. Always points to the most recent tag." \
            --latest=false

  snap:
    name: Build and publish Snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: snapcore/action-build@v1
        id: build

      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
