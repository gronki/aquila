name: Build and release edge AppImage

env:
  VERBOSE: 1

jobs:

  test:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    name: Test (ubuntu:24.04, release, OpenMP)
    env:
      CC: gcc
      CXX: g++
      FC: gfortran
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y cmake g++ gfortran libpng-dev libreadline-dev pkg-config binutils wget git curl

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download test data
        run: |
          scripts/get_test_data.sh
          echo "PATH=$PATH:/opt/aquila/bin" >> "$GITHUB_ENV"

      - name: Build and install the app (release, OpenMP)
        run: |
          mkdir -p build && rm -rf build/*
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DAQUILA_PARALLEL=On ..
          cmake --build .
          cmake --install .

      - name: Run unit tests
        run: |
          cd build
          ctest . --output-on-failure

      - name: Run integration test on example data
        run: |
          mkdir testrun
          cd testrun
          ln -s ../examples
          ln -s ../testdata
          ../scripts/test_routine.sh

  build-appimage:
    needs: test
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build AppImage
        env:
          VERSION: edge
          ARCH: ${{ matrix.arch }}
        run: |
          sudo bash scripts/build_appimage.sh
          mv aquila-${{ matrix.arch }}.AppImage aquila-edge-${{ matrix.arch }}.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: "aquila-edge-${{ matrix.arch }}"
          path: aquila-edge-${{ matrix.arch }}.AppImage

  release-edge:
    name: Release edge AppImage
    runs-on: ubuntu-latest
    needs: build-appimage
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "aquila-edge-*"
          merge-multiple: true

      - name: Update edge release
        run: |
          gh release delete edge --yes --cleanup-tag 2>/dev/null || true
          gh release create edge aquila-edge-*.AppImage \
            --title "Aquila edge (${{ github.sha }})" \
            --notes "Latest build from master. May be unstable." \
            --prerelease \
            --latest=false
